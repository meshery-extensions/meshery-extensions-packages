name: Layer5 Cloud Tests

on:
  workflow_call:
    inputs:
      pr_commit_sha:
        description: "Git commit SHA to checkout for testing"
        required: true
        type: string
      pr_number:
        description: "PR number for comment updates (empty for push events)"
        default: ""
        required: false
        type: string
      run_integration_tests:
        description: "Whether to run integration tests"
        default: false
        required: false
        type: boolean
      node_version:
        description: "Node.js version for UI tests"
        required: false
        default: '20.x'
        type: string
    secrets:
      GH_ACCESS_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      pr_commit_sha:
        description: "Git commit SHA to checkout for testing"
        required: true
        type: string
      pr_number:
        description: "PR number for comment updates (leave empty for master/qa runs)"
        required: false
        default: ""
      run_integration_tests:
        description: "Whether to run integration tests"
        required: false
        default: false
        type: boolean
      node_version:
        description: "Node.js version for UI tests"
        required: false
        default: '20.x'
        type: string

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Checkout for composite action
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/cloud-comment
          sparse-checkout-cone-mode: false

      - name: Comment starting
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: "Starting Cloud Server tests ([takes approximately 8 min end-to-end](https://github.com/layer5labs/meshery-extensions-packages/actions/runs/${{ github.run_id }}))..."
          append: false
          recreate: true

      #------------------------------------------
      - name: Checkout Cloud code
        uses: actions/checkout@v6
        with:
          repository: layer5io/meshery-cloud
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.pr_commit_sha }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 1
          path: meshery-cloud

      - name: Comment checkout success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":heavy_check_mark: Checked out meshery-cloud repo."
      - name: Comment checkout failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Failed to clone meshery-cloud repo."
      #------------------------------------------

      #------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: Download dependencies
        working-directory: meshery-cloud
        run: |
          go mod download
          go mod verify

      - name: Comment Go setup success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":heavy_check_mark: Setup Golang environment. Running unit tests... (takes approximately 3 min)"
      - name: Comment Go setup failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Failed to setup Golang environment."
      #------------------------------------------

      #------------------------------------------
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        working-directory: meshery-cloud
        run: make server-tests-unit

      - name: Comment unit tests success
        if: steps.unit-tests.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":heavy_check_mark: Unit tests passed. Running integration tests..."
      - name: Comment unit tests failure
        if: steps.unit-tests.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Unit tests failed. Running integration tests..."
      #------------------------------------------

      #------------------------------------------
      - name: Run integration tests
        id: integration-tests
        continue-on-error: true
        if: ${{ inputs.run_integration_tests }}
        working-directory: meshery-cloud
        run: make ENVIRONMENT=staging server-tests-integration

      - name: Comment integration tests success
        if: steps.integration-tests.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":heavy_check_mark: Golang integration tests passed."
      - name: Comment integration tests failure
        if: steps.integration-tests.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Golang integration tests failed."
      - name: Comment integration tests skipped
        if: steps.integration-tests.outcome == 'skipped'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":fast_forward: Integration tests skipped (not requested)."
      #------------------------------------------

      #------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: meshery-cloud/allure-results/
          if-no-files-found: ignore
          retention-days: 14
      #------------------------------------------

      #------------------------------------------
      - name: Checkout qa.meshery.io repo
        if: ${{ inputs.pr_number == '' && steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        uses: actions/checkout@v6
        with:
          repository: meshery/qa
          path: qa
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Sync results with QA
        if: ${{ inputs.pr_number == '' && steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        working-directory: qa
        run: make remote-provider-results-sync REMOTE_PROVIDER_RESULTS_PATH=../meshery-cloud/allure-results/

      - name: Commit & push results to QA
        if: ${{ inputs.pr_number == '' && steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[Extension] Sync Remote Provider Cloud Server Test Results - ${{ github.sha }}"
          commit_options: --signoff
          repository: qa
          file_pattern: "remote-provider-results/**"
          commit_user_name: meshery-ci
          commit_user_email: ci@meshery.io
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Comment QA sync success
        if: ${{ success() && inputs.pr_number == '' && steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":heavy_check_mark: Sync'ed test results to qa.meshery.io repo."
      - name: Comment QA sync failure
        if: ${{ failure() && inputs.pr_number == '' && steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Failed to sync test results to qa.meshery.io repo."
      - name: Comment QA sync skipped
        if: ${{ inputs.pr_number == '' && (steps.unit-tests.outcome == 'failure' || steps.integration-tests.outcome == 'failure') }}
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":warning: Skipped QA sync — test failures detected."
      #------------------------------------------

      #------------------------------------------
      - name: Comment final success
        if: ${{ steps.unit-tests.outcome == 'success' && (steps.integration-tests.outcome == 'success' || steps.integration-tests.outcome == 'skipped') }}
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":white_check_mark: All Layer5 Cloud Server tests completed successfully."
      - name: Comment final failure
        if: ${{ steps.unit-tests.outcome == 'failure' || steps.integration-tests.outcome == 'failure' }}
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-tests
          message: ":x: Layer5 Cloud Server tests completed with failures. See [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Fail if any tests failed
        if: ${{ steps.unit-tests.outcome == 'failure' || steps.integration-tests.outcome == 'failure' }}
        run: |
          echo "::error::Test failures detected"
          [ "${{ steps.unit-tests.outcome }}" = "failure" ] && echo "  - Unit tests failed"
          [ "${{ steps.integration-tests.outcome }}" = "failure" ] && echo "  - Integration tests failed"
          exit 1
      #------------------------------------------

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Checkout for composite action
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/cloud-comment
          sparse-checkout-cone-mode: false

      - name: Comment starting
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: "Starting Cloud UI tests ([workflow run](https://github.com/layer5labs/meshery-extensions-packages/actions/runs/${{ github.run_id }}))..."
          append: false
          recreate: true

      #------------------------------------------
      - name: Checkout Cloud code
        uses: actions/checkout@v6
        with:
          repository: layer5io/meshery-cloud
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.pr_commit_sha }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 1
          path: meshery-cloud

      - name: Comment checkout success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":heavy_check_mark: Checked out meshery-cloud repo."
      - name: Comment checkout failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":x: Failed to clone meshery-cloud repo."
      #------------------------------------------

      #------------------------------------------
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"
          cache-dependency-path: meshery-cloud/ui/package-lock.json

      - name: Comment Node setup success
        if: steps.setup-node.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":heavy_check_mark: Setup Node.js. Installing dependencies..."
      - name: Comment Node setup failure
        if: steps.setup-node.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":x: Failed to setup Node.js."
      #------------------------------------------

      #------------------------------------------
      - name: Install UI dependencies
        id: install-deps
        working-directory: meshery-cloud
        run: make ui-setup

      - name: Comment deps success
        if: steps.install-deps.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":heavy_check_mark: Installed UI dependencies. Running UI tests..."
      - name: Comment deps failure
        if: steps.install-deps.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":x: Failed to install UI dependencies."
      #------------------------------------------

      #------------------------------------------
      - name: Run UI tests
        id: ui-tests
        working-directory: meshery-cloud
        run: make ui-tests

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: meshery-cloud/ui/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment UI tests success
        if: steps.ui-tests.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":white_check_mark: All Cloud UI tests passed."
      - name: Comment UI tests failure
        if: steps.ui-tests.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          id: cloud-ui-tests
          message: ":x: Cloud UI tests failed. See [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
      #------------------------------------------

name: Meshery Extension Test

on:

  workflow_dispatch:
    inputs:
      checkout_ref:
        default: "refs/heads/master"
        required: true
        type: string
      pr_number:
        default: ""
        required: false
        type: string
      test_command:
        default: "make test"
        required: false
        type: string
        
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
      pr_number:
        default: ""
        required: false
        type: string
      test_command:
        default: "make test"
        required: false
        type: string
      head_sha:
        default: ""
        required: false
        type: string
    secrets:
      PROVIDER_TOKEN:
        required: true
      GH_ACCESS_TOKEN:
        required: true
      LAYER5_CLOUD_TESTING_BOT_EMAIL:
        required: true
      LAYER5_CLOUD_TESTING_BOT_PASSWORD:
        required: true

jobs:
  comment-starting-point:
    runs-on: ubuntu-24.04
    if: ${{ inputs.pr_number != ''  }}
    steps:
      - name: comment starting point
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: "Starting [Meshery Extensions tests](https://github.com/meshery-extensions/meshery-extensions-packages/actions/runs/${{ github.run_id }})..."
          recreate: true

  build-meshery-extension:
    uses: ./.github/workflows/build-extension-reusable.yml
    secrets: inherit
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      pr_number: ${{ inputs.pr_number }}
      comment_id: extension-test

  # Posts a PR comment and sets commit status when the build fails,
  # preventing a silent "pending" status that never resolves.
  comment-build-failure:
    needs: build-meshery-extension
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Comment build failure on PR
        if: ${{ inputs.pr_number != '' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: ":x: Extension build failed. Tests were not run. [See build logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          append: true
      - name: Set failure commit status
        if: ${{ inputs.head_sha != '' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const [owner, repo] = 'layer5labs/meshery-extensions'.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ inputs.head_sha }}',
              state: 'failure',
              context: 'Meshery Extension E2E Tests',
              description: 'Extension build failed — tests were not run',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  tests-ui-e2e:
    needs: build-meshery-extension
    name: UI end-to-end tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Playwright sharding: split the suite across N runners. Wall-clock reduction
    # is roughly linear in the shard count; total runner-minutes increase because
    # each shard re-runs the environment setup (Kind cluster, Docker pull, etc).
    # Keep fail-fast: false so a failure in shard 1 doesn't cancel shards 2–4
    # and lose their signal.
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        #shard: [1, 2, 3, 4]
    # Expose the matrix size so the non-matrix summary job can report the
    # configured shard count even if some shards never produced an outcome
    # marker (runner crash, timeout, cancelled artifact upload). Every shard
    # writes the same value; GitHub collects whichever one lands.
    outputs:
      shard_count: ${{ steps.shard_meta.outputs.shard_count }}

    steps:
      - name: Record shard count
        id: shard_meta
        run: echo "shard_count=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: comment progress start
        if: ${{ inputs.pr_number != '' && matrix.shard == 1 }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: ":heavy_check_mark: Setting up test environment (sharded across ${{ strategy.job-total }} ${{ strategy.job-total == 1 && 'runner' || 'runners' }})..."
          append: true
      - name: Set pending commit status
        if: ${{ inputs.head_sha != '' && matrix.shard == 1 }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const [owner, repo] = 'layer5labs/meshery-extensions'.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ inputs.head_sha }}',
              state: 'pending',
              context: 'Meshery Extension E2E Tests',
              description: 'Tests are running (${{ strategy.job-total }} shard${{ strategy.job-total == 1 && '' || 's' }})...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}

      # Moved up: checkout has no dependency on Kind/Docker and can
      # run while those slower steps proceed.
      - name: Checkout Meshery-extensions code
        uses: actions/checkout@v6
        with:
          repository: layer5labs/meshery-extensions
          path: meshery-extensions
          ref: ${{ inputs.checkout_ref }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Set Release extensions
        run: |
          curl -s https://api.github.com/repos/meshery-extensions/meshery-extensions-packages/releases > extension_releases.json
          TAG=$(jq -r '.[0].tag_name' extension_releases.json)
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Update /etc/hosts
        run: echo "127.0.0.1 mesherylocal.layer5.io" | sudo tee -a /etc/hosts

      # Start the image pull in the background so it overlaps with
      # Kind cluster creation and Playwright install (~30-60s saved).
      - name: Pull Meshery image in background
        run: |
          nohup docker pull docker.io/meshery/meshery:edge-latest > /tmp/docker-pull.log 2>&1 &
          echo $! > /tmp/docker-pull.pid

      # - name: Create k8s Kind Cluster
      #   uses: helm/kind-action@v1.13.0
      #   with:
      #     cluster_name: kind-cluster

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('meshery-extensions/package-lock.json') }}

      - name: Install Playwright dependencies
        working-directory: meshery-extensions
        run: make test-setup

      - name: make directories
        run: |
          mkdir -p /home/runner/.meshery/provider/Meshery/${{ env.tag }}/provider/

      - name: Wait for Meshery image pull
        run: |
          PID=$(cat /tmp/docker-pull.pid)
          while kill -0 "$PID" 2>/dev/null; do sleep 1; done
          cat /tmp/docker-pull.log

      - name: Run backend (Docker)
        run: |
          docker run -d \
            --name meshery-backend \
            -p 9081:9081 \
            -e PROVIDER_BASE_URLS=https://cloud.layer5.io \
            -e PORT=9081 \
            -e BUILD=${{ env.tag }} \
            docker.io/meshery/meshery:edge-latest

      - name: Download Meshery-extension-ui artifacts
        uses: actions/download-artifact@v4
        with:
          name: meshery-extension-ui
          path: provider

      - name: Move provider files
        run: |
          docker exec -u root meshery-backend \
            mkdir -p /home/appuser/.meshery/provider/Layer5/${{ env.tag }}/provider
          docker cp provider/. meshery-backend:/home/appuser/.meshery/provider/Layer5/${{ env.tag }}/provider

      # Prevents flaky test starts by waiting for the server to be healthy.
      - name: Wait for Meshery to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9081/api/system/version && break
            sleep 2
          done

      - name: Record test start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # When strategy.job-total > 1, forward SHARD=X/N to playwright so each
      # runner exercises only its slice of the test suite. With a single runner
      # the --shard flag is redundant; omitting it avoids shard-metadata
      # overhead and keeps the run semantically equivalent to a local `make test`.
      - name: Run Tests
        id: run_tests
        continue-on-error: true
        working-directory: meshery-extensions
        run: |
          ls
          if [ "${{ inputs.test_command }}" = "make test" ]; then
            if [ "${{ strategy.job-total }}" -gt 1 ]; then
              make test SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
            else
              make test
            fi
          else
            ${{ inputs.test_command }}
          fi
        env:
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}
          MESHERY_SERVER_URL: http://localhost:9081
          REMOTE_PROVIDER_URL: https://cloud.layer5.io
          REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.LAYER5_CLOUD_TESTING_BOT_EMAIL }}
          REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.LAYER5_CLOUD_TESTING_BOT_PASSWORD }}
          KANVAS_TIMEOUT_MULTIPLIER: "3"
          ALLURE_LABEL_project: Kanvas
          ALLURE_LABEL_type: e2e

      - name: Calculate test duration
        id: duration
        if: ${{ always() }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          echo "duration=$(printf '%dm %ds' $((elapsed/60)) $((elapsed%60)))" >> "$GITHUB_OUTPUT"

      - name: Stage shard artifacts
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shard-artifacts
          for artifact_dir in test-results playwright-report allure-results; do
            if [ -d "meshery-extensions/tests/${artifact_dir}" ]; then
              cp -R "meshery-extensions/tests/${artifact_dir}" "shard-artifacts/${artifact_dir}"
            fi
          done

      - name: Upload shard artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: shard-artifacts/
          retention-days: 30

      - name: Upload shard outcome marker
        if: ${{ always() }}
        run: |
          mkdir -p shard-outcome
          printf '%s' '${{ steps.run_tests.outcome }}' > shard-outcome/shard-${{ matrix.shard }}.txt

      - name: Upload shard outcome artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-outcome-${{ matrix.shard }}
          path: shard-outcome/
          retention-days: 1

  # Aggregation job: downloads every shard's artifacts and produces a single
  # PR comment, commit status, and Allure sync. Runs exactly once regardless of
  # how many shards the matrix has. `if: always()` ensures it runs even when
  # one shard fails, so the PR comment reflects the real outcome rather than
  # getting stuck on the pending status.
  tests-ui-e2e-summary:
    needs: tests-ui-e2e
    if: ${{ always() && needs.tests-ui-e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download Playwright shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-artifacts-shard-*
          path: shard-artifacts

      - name: Download shard outcome artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-outcome-*
          path: shard-artifacts
      - name: Aggregate shard outcomes
        id: aggregate
        run: |
          set -euo pipefail
          if [ ! -d shard-artifacts ]; then
            echo "Expected artifact directory 'shard-artifacts' was not found. Ensure shard artifacts were downloaded and extracted successfully." >&2
            exit 1
          fi
          # Use find to locate shard-*.txt files regardless of artifact extraction layout.
          # This is robust against variations in how download-artifact arranges directories.
          mapfile -t shard_outcome_files < <(find shard-artifacts -name "shard-*.txt" -type f | sort)
          if [ "${#shard_outcome_files[@]}" -eq 0 ]; then
            echo "No shard outcome markers were found in shard-artifacts." >&2
            echo "Contents of shard-artifacts:" >&2
            find shard-artifacts -maxdepth 3 | head -50 >&2 || true
            exit 1
          fi
          overall="success"
          for f in "${shard_outcome_files[@]}"; do
            outcome=$(cat "$f")
            echo "Shard $(basename "$f" .txt) outcome: $outcome"
            if [ "$outcome" = "failure" ]; then
              overall="failure"
            elif [ "$outcome" = "cancelled" ] && [ "$overall" = "success" ]; then
              overall="cancelled"
            fi
          done
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          # Fallback shard count from the number of outcome markers collected.
          # The primary source is needs.tests-ui-e2e.outputs.shard_count (from
          # strategy.job-total); this covers the edge case where that output is
          # empty (e.g. all matrix legs cancelled before step 1 ran).
          echo "count=${#shard_outcome_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Collect per-shard reports
        id: test_reports
        run: |
          set -euo pipefail
          mkdir -p aggregated
          # Each shard writes its own tests/test-results/test-report.md; concatenate
          # them with shard headers so the PR comment covers the full suite.
          {
            for dir in shard-artifacts/playwright-artifacts-shard-*; do
              [ -d "$dir" ] || continue
              shard=$(basename "$dir" | sed 's/playwright-artifacts-shard-//')
              report=""
              if [ -f "$dir/test-results/test-report.md" ]; then
                report="$dir/test-results/test-report.md"
              elif [ -f "$dir/meshery-extensions/tests/test-results/test-report.md" ]; then
                report="$dir/meshery-extensions/tests/test-results/test-report.md"
              fi
              if [ -n "$report" ] && [ -f "$report" ]; then
                echo "#### Shard $shard"
                cat "$report"
                echo
              else
                echo "#### Shard $shard"
                echo "_No test report found_"
                echo
              fi
            done
          } > aggregated/summary.md

          cat aggregated/summary.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo "result<<EOF"
            head -n 200 aggregated/summary.md
            if [ "$(wc -l < aggregated/summary.md)" -gt 200 ]; then
              echo "_(Truncated. Full report in job summary.)_"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: comment the summary
        if: ${{ inputs.pr_number != '' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: |
            ### Test Results

            **Meshery:** `stable-latest` | **Shards:** ${{ needs.tests-ui-e2e.outputs.shard_count || steps.aggregate.outputs.count }} | **Overall:** ${{ steps.aggregate.outputs.overall }}

            ${{ steps.test_reports.outputs.result }}

            **[QA dashboard for this PR](https://qa.meshery.io/pr/${{ inputs.pr_number }}/)** | **[Full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})** | **[Download Playwright traces & screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)**
          append: true

      - name: Checkout QA
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          repository: meshery-extensions/qa
          path: qa
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Merge Allure results across shards
        if: ${{ !cancelled() }}
        run: |
          mkdir -p merged-allure-results
          # Each shard may download with the original uploaded path preserved.
          # Support both the nested artifact layout and the direct-root layout
          # so the QA sync sees the full run without changing upload behavior.
          for dir in \
            shard-artifacts/playwright-artifacts-shard-*/meshery-extensions/tests/allure-results \
            shard-artifacts/playwright-artifacts-shard-*/allure-results; do
            [ -d "$dir" ] || continue
            cp -R "$dir/." merged-allure-results/
          done

      # Master runs populate the canonical kanvas-results/ tree that feeds the
      # main qa.meshery.io dashboard. PR runs land under pr-reports/<N>/ so
      # they stay isolated from the master report — qa's publish workflow's
      # `kanvas-results/**` path filter won't fire on pr-reports/**.
      - name: Sync results with qa
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr_number }}" ]; then
            DEST="qa/pr-reports/${{ inputs.pr_number }}/kanvas-results"
          else
            DEST="qa/kanvas-results"
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          if [ -d merged-allure-results ] && [ -n "$(ls -A merged-allure-results 2>/dev/null)" ]; then
            cp -R merged-allure-results/. "$DEST/"
            echo "Synced $(find "$DEST" -type f | wc -l) file(s) to $DEST"
          else
            echo "No merged-allure-results to sync"
          fi

      - name: Commit & push results to qa
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Kanvas] Sync E2E Test Results - ${GITHUB_SHA}"
          commit_options: --signoff
          repository: qa
          file_pattern: ${{ inputs.pr_number != '' && format('pr-reports/{0}', inputs.pr_number) || 'kanvas-results' }}
          commit_user_name: meshery-ci
          commit_user_email: ci@meshery.io
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Comment Test failure
        if: ${{ inputs.pr_number != '' && steps.aggregate.outputs.overall == 'failure' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: ":x: One or more tests have failed."
          append: true

      - name: Comment Final Status
        if: ${{ inputs.pr_number != '' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          repository: layer5labs/meshery-extensions
          number: ${{ inputs.pr_number }}
          id: extension-test
          message: ":heavy_check_mark: Meshery Extension tests completed."
          append: true

      - name: Set final commit status
        if: ${{ inputs.head_sha != '' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const [owner, repo] = 'layer5labs/meshery-extensions'.split('/');
            const outcome = '${{ steps.aggregate.outputs.overall }}';
            const stateMap = { success: 'success', failure: 'failure', cancelled: 'error' };
            const state = stateMap[outcome] || 'error';
            const shardCount = parseInt('${{ needs.tests-ui-e2e.outputs.shard_count || steps.aggregate.outputs.count }}') || 1;
            const descMap = {
              success: `All tests passed (${shardCount} shard${shardCount === 1 ? '' : 's'})`,
              failure: 'One or more tests failed',
              cancelled: 'Run was cancelled',
            };
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ inputs.head_sha }}',
              state,
              context: 'Meshery Extension E2E Tests',
              description: descMap[outcome] || 'Unexpected test outcome',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

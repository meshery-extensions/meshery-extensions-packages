name: Publish Meshery Design Embed Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example: 0.4.1)"
        required: true
        type: string
  push:
    tags:
      - "meshery-design-embed-v*"

concurrency:
  group: publish-meshery-design-embed
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Ensure workflow runs from the default branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "This workflow must be run from ${{ github.event.repository.default_branch }}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: meshery-design-embed/package-lock.json

      - name: Set package version
        working-directory: meshery-design-embed
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Commit release version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meshery-design-embed/package.json meshery-design-embed/package-lock.json
          git commit -m "Release meshery-design-embed ${{ inputs.version }}"
          git tag "meshery-design-embed-v${{ inputs.version }}"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "meshery-design-embed-v${{ inputs.version }}"

  publish-package:
    name: Bundle and publish package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: meshery-design-embed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@layer5"
          cache: npm
          cache-dependency-path: meshery-design-embed/package-lock.json

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify tag version matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#meshery-design-embed-v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Package version ${PACKAGE_VERSION} does not match tag version ${TAG_VERSION}."
            exit 1
          fi

      - name: Bundle package
        run: npm run build

      - name: Publish package to npm with OIDC
        run: npm publish --provenance --access public

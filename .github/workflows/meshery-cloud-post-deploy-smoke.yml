# Post-deploy smoke for a Layer5 Cloud production release. It waits for the
# rollout to report the released version, runs the core smoke, then probes
# the hosted MCP endpoints. Every probe is read-only. Emails are sent ONLY
# when a named step failed, never on success or skipped runs.
#
# The smoke scripts come from layer5io/meshery-cloud at master, sparse
# checked out (install/scripts/smoke-tests only) per this repo's rule for
# large checkouts. Secrets reach only the steps that need them, through
# `env:` or `with:`, never through `run:` text: this repo is public and so
# are its logs.

name: Cloud post-deploy smoke

on:
  workflow_call:
    inputs:
      release-version:
        description: Expected release (for example v1.0.373). Empty or "latest" only requires a non-empty version.
        type: string
        required: false
        default: ""
      base_url:
        type: string
        required: false
        default: https://cloud.layer5.io
      targets:
        description: Override of the MCP targets (space or newline separated MCP resource URLs).
        type: string
        required: false
        default: ""
      rollout_timeout_minutes:
        type: number
        required: false
        default: 15
      subject_prefix:
        description: Label for test runs, for example "[TEST] ".
        type: string
        required: false
        default: ""
      require_signed_in:
        description: Treat an unconfigured signed-in MCP tier as a failure.
        type: boolean
        required: false
        default: false
    secrets:
      GH_ACCESS_TOKEN:
        required: true
      MAIL_USERNAME:
        required: false
      MAIL_PASSWORD:
        required: false
      MCP_SMOKE_ALERT_EMAIL:
        required: false
      MCP_SMOKE_ACCESS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release-version:
        description: Expected release (for example v1.0.373). Empty or "latest" only requires a non-empty version.
        type: string
        required: false
        default: ""
      base_url:
        type: string
        required: false
        default: https://cloud.layer5.io
      targets:
        description: Override of the MCP targets (space or newline separated MCP resource URLs).
        type: string
        required: false
        default: ""
      rollout_timeout_minutes:
        type: number
        required: false
        default: 15
      subject_prefix:
        description: Label for test runs, for example "[TEST] ".
        type: string
        required: false
        default: ""
      require_signed_in:
        description: Treat an unconfigured signed-in MCP tier as a failure.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer release supersedes an older run still waiting on its rollout.
concurrency:
  group: cloud-post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Cloud post-deploy smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # First, so an unsafe release-version never reaches an email field.
      # On failure version_label is "invalid" and every subject uses it.
      # continue-on-error lets the checkouts below still run so the alert
      # action exists; the final gate step fails the job.
      - name: Validate the release version
        id: guard
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -u
          if ! [[ "$RELEASE_VERSION" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "version_label=invalid" >> "$GITHUB_OUTPUT"
            echo "::error::release-version has an invalid format"
            exit 1
          fi
          echo "version_label=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the smoke scripts
        uses: actions/checkout@v7
        with:
          repository: layer5io/meshery-cloud
          ref: master
          fetch-depth: 1
          path: cloud-smoke
          sparse-checkout: |
            install/scripts/smoke-tests
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          persist-credentials: false

      # No email from here: a missing script is a merge-order problem, and
      # the later steps are gated on this outcome, so none of them runs
      # into an opaque exit 127.
      - name: Require the smoke scripts
        id: scripts
        run: |
          missing=0
          for f in mcp.sh mcp-signed-in.sh mcp_common.sh; do
            if [ ! -f "cloud-smoke/install/scripts/smoke-tests/$f" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::smoke scripts are missing from layer5io/meshery-cloud master (mcp.sh, mcp-signed-in.sh, mcp_common.sh)"
            exit 1
          fi

      - name: Check out the alert action
        if: ${{ !cancelled() }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
          path: alert-action
          sparse-checkout: |
            .github/actions/mcp-smoke-alert
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Wait for the rollout
        id: rollout
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          TIMEOUT_MINUTES: ${{ inputs.rollout_timeout_minutes }}
        run: |
          set -u
          if ! [[ "$TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_MINUTES" -lt 1 ] || [ "$TIMEOUT_MINUTES" -gt 20 ]; then
            echo "::error::rollout_timeout_minutes must be an integer from 1 to 20, got '$TIMEOUT_MINUTES'"
            exit 1
          fi
          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::release-version has an invalid format"
            exit 1
          fi
          expected=""
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "latest" ]; then
            expected="production-$RELEASE_VERSION"
            echo "waiting for $BASE_URL to report version $expected"
          else
            echo "no release version given: waiting for $BASE_URL to report any non-empty version"
          fi
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          seen_version=""
          seen_sha=""
          consecutive=0
          # Three matching reads in a row, so one pod that already runs the
          # new version does not confirm a rollout still in progress.
          while :; do
            body="$(curl -fsS --max-time 10 "${BASE_URL%/}/api/system/version" 2>/dev/null || true)"
            seen_version="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            seen_sha="$(printf '%s' "$body" | jq -r '.commitsha // empty' 2>/dev/null || true)"
            if [ -n "$seen_version" ] && { [ -z "$expected" ] || [ "$seen_version" = "$expected" ]; }; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                echo "rollout confirmed: version=$seen_version commitsha=$seen_sha (3 consecutive reads)"
                exit 0
              fi
              echo "version matches ($consecutive of 3 consecutive reads)"
              if [ "$(date +%s)" -ge "$deadline" ]; then
                break
              fi
              sleep 5
              continue
            fi
            consecutive=0
            if [ "$(date +%s)" -ge "$deadline" ]; then
              break
            fi
            echo "not yet (version='${seen_version:-unreachable}'), retrying in 15s"
            sleep 15
          done
          echo "::error::rollout timed out after $TIMEOUT_MINUTES min: expected '${expected:-any non-empty version}', last saw version='${seen_version:-none}' commitsha='${seen_sha:-none}'"
          exit 1

      # A wrong version proves nothing about the release, so the core smoke
      # is skipped (outcome skipped) when the rollout did not confirm.
      - name: Core smoke
        id: core
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' && steps.rollout.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: bash cloud-smoke/install/scripts/smoke-tests/smoke.sh

      - name: MCP smoke
        id: mcp
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' }}
        continue-on-error: true
        env:
          TARGETS: ${{ inputs.targets || vars.MCP_SMOKE_TARGETS }}
        run: |
          set -u
          read -r -a targets <<< "$(printf '%s' "$TARGETS" | tr '\n\r\t' '   ')"
          if [ "${#targets[@]}" -eq 0 ]; then
            targets=("https://cloud.layer5.io/mcp")
          fi
          failed=""
          for t in "${targets[@]}"; do
            echo "::group::mcp.sh $t"
            rc=0
            if [[ "$t" =~ ^https?:// ]]; then
              MCP_URL="$t" bash cloud-smoke/install/scripts/smoke-tests/mcp.sh || rc=$?
            else
              echo "target is not an http(s) URL"
              rc=2
            fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::MCP smoke failed for $t (exit $rc)"
              failed="${failed}${t} (exit ${rc})"$'\n'
            fi
          done
          {
            echo "failed<<EOF_FAILED"
            printf '%s' "$failed"
            echo "EOF_FAILED"
          } >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      - name: MCP signed-in smoke
        id: mcp-signed-in
        if: ${{ !cancelled() && steps.scripts.outcome == 'success' }}
        continue-on-error: true
        env:
          TARGETS: ${{ inputs.targets || vars.MCP_SMOKE_TARGETS }}
          REQUIRE_SIGNED_IN: ${{ inputs.require_signed_in || vars.MCP_SMOKE_REQUIRE_SIGNED_IN == 'true' }}
          MCP_SMOKE_ACCESS_TOKEN: ${{ secrets.MCP_SMOKE_ACCESS_TOKEN }}
        run: |
          set -u
          if [ -n "$MCP_SMOKE_ACCESS_TOKEN" ]; then
            echo "::add-mask::$MCP_SMOKE_ACCESS_TOKEN"
          fi
          read -r -a targets <<< "$(printf '%s' "$TARGETS" | tr '\n\r\t' '   ')"
          if [ "${#targets[@]}" -eq 0 ]; then
            targets=("https://cloud.layer5.io/mcp")
          fi
          failed=""
          unconfigured=0
          for t in "${targets[@]}"; do
            echo "::group::mcp-signed-in.sh $t"
            rc=0
            if [[ "$t" =~ ^https?:// ]]; then
              MCP_URL="$t" bash cloud-smoke/install/scripts/smoke-tests/mcp-signed-in.sh || rc=$?
            else
              echo "target is not an http(s) URL"
              rc=2
            fi
            echo "::endgroup::"
            if [ "$rc" -eq 3 ]; then
              unconfigured=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::signed-in MCP smoke failed for $t (exit $rc)"
              failed="${failed}${t} signed-in (exit ${rc})"$'\n'
            fi
          done
          if [ "$unconfigured" -eq 1 ]; then
            if [ "$REQUIRE_SIGNED_IN" = "true" ]; then
              echo "::error::signed-in MCP tier is not configured but is required"
              failed="${failed}signed-in tier not configured (required)"$'\n'
            else
              echo "::warning::signed-in MCP tier is not configured"
              echo "signed-in MCP tier is not configured (not required for this run)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "failed<<EOF_FAILED"
            printf '%s' "$failed"
            echo "EOF_FAILED"
          } >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      - name: Email Cloud rollout or core failure
        if: ${{ !cancelled() && (steps.guard.outcome == 'failure' || steps.rollout.outcome == 'failure' || steps.core.outcome == 'failure') }}
        uses: ./alert-action/.github/actions/mcp-smoke-alert
        with:
          to: |
            "Layer5 Support" <support@layer5.io>
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ inputs.subject_prefix }}[GitHub Actions] Cloud post-deploy smoke failure: ${{ steps.guard.outcome == 'failure' && 'version guard' || steps.rollout.outcome == 'failure' && 'rollout' || 'core smoke' }} ${{ steps.guard.outputs.version_label }}"
          reason: "Post-deploy smoke failed for ${{ inputs.base_url }} - version guard: ${{ steps.guard.outcome }}, rollout: ${{ steps.rollout.outcome }}, core smoke: ${{ steps.core.outcome }}"

      - name: Email MCP failure
        if: ${{ !cancelled() && (steps.mcp.outcome == 'failure' || steps.mcp-signed-in.outcome == 'failure') }}
        uses: ./alert-action/.github/actions/mcp-smoke-alert
        with:
          to: ${{ secrets.MCP_SMOKE_ALERT_EMAIL }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ inputs.subject_prefix }}[GitHub Actions] Cloud post-deploy smoke failure: ${{ steps.mcp.outcome == 'failure' && 'MCP' || 'MCP signed-in' }} ${{ steps.guard.outputs.version_label }}"
          reason: "MCP smoke failed after the Cloud deploy - MCP: ${{ steps.mcp.outcome }}, MCP signed-in: ${{ steps.mcp-signed-in.outcome }}"
          failed_checks: |
            ${{ steps.mcp.outputs.failed }}
            ${{ steps.mcp-signed-in.outputs.failed }}

      - name: Summarize and gate
        if: ${{ !cancelled() }}
        env:
          GUARD: ${{ steps.guard.outcome }}
          SCRIPTS: ${{ steps.scripts.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          CORE: ${{ steps.core.outcome }}
          MCP: ${{ steps.mcp.outcome }}
          MCP_SIGNED_IN: ${{ steps.mcp-signed-in.outcome }}
          RELEASE_VERSION: ${{ steps.guard.outputs.version_label }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          {
            echo "### Cloud post-deploy smoke"
            echo ""
            echo "Release: \`${RELEASE_VERSION:-unspecified}\` on \`$BASE_URL\`"
            echo ""
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| version guard | $GUARD |"
            echo "| smoke scripts | $SCRIPTS |"
            echo "| rollout | $ROLLOUT |"
            echo "| core smoke | $CORE |"
            echo "| MCP | $MCP |"
            echo "| MCP signed-in | $MCP_SIGNED_IN |"
          } >> "$GITHUB_STEP_SUMMARY"
          for o in "$GUARD" "$SCRIPTS" "$ROLLOUT" "$CORE" "$MCP" "$MCP_SIGNED_IN"; do
            if [ "$o" = "failure" ]; then
              echo "::error::one or more post-deploy smoke checks failed"
              exit 1
            fi
          done

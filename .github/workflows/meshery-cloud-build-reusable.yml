name: Meshery Cloud Build Reusable
on:
  workflow_call:
    inputs:
      pr_commit_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      node_version:
        description: "Node.js version for UI build/tests"
        required: false
        default: '20.x'
        type: string
    secrets:
      PROVIDER_TOKEN:
        required: true
      GLOBAL_TOKEN:
        required: true
      GH_ACCESS_TOKEN:
        required: true
      LAYER5_CLOUD_USERNAME:
        required: true
      LAYER5_CLOUD_PASSWORD:
        required: true
      LAYER5_CLOUD_TESTING_BOT_EMAIL:
        required: true
      LAYER5_CLOUD_TESTING_BOT_PASSWORD:
        required: true
      DOCKER_USERNAME: 
        required: true
      DOCKER_PASSWORD: 
        required: true
      MAIL_USERNAME: 
        required: true
      MAIL_PASSWORD: 
        required: true
      OCI_BASTION_HOST:
        required: true
      OCI_BASTION_USERNAME:
        required: true
      OCI_BASTION_KEY:
        required: true
        
jobs:
  set-pending-status:
    runs-on: ubuntu-24.04
    steps:
      - name: Set pending commit status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'layer5io',
              repo: 'meshery-cloud',
              sha: '${{ inputs.pr_commit_sha }}',
              state: 'pending',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Cloud build and tests in progress...',
              context: 'Meshery Cloud Build'
            });
  build-meshery-cloud:
    name: Server Build
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Checkout for composite action
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/cloud-comment
          sparse-checkout-cone-mode: false

      - name: comment success
        uses: ./.github/actions/cloud-comment
        with:
          message: "Starting Cloud Server build ([takes approximately 10 min end-to-end](https://github.com/layer5labs/meshery-extensions-packages/actions/runs/${{ github.run_id }}))..."
          append: false
          recreate: true
      
      - name: Checkout Cloud code (PR head)
        uses: actions/checkout@v6
        with:
          repository: "layer5io/meshery-cloud"
          path: ./meshery-cloud
          fetch-depth: 1
          ref: refs/pull/${{ inputs.pr_number }}/head
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Checked out Cloud repo."
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to checkout Cloud repo."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./meshery-cloud/go.mod
          cache: true
      # ALLURE_OUTPUT_PATH routes allure-go writers to <path>/allure-results,
      # which the sync-to-qa step at the end of this job picks up. We don't
      # gate later steps on Go test pass/fail — sync runs unconditionally so
      # the QA dashboard reflects every run.
      - name: Run Go tests with coverage
        id: go-test
        working-directory: meshery-cloud
        continue-on-error: true
        env:
          ALLURE_OUTPUT_PATH: ${{ github.workspace }}/meshery-cloud
        run: |
          set -eo pipefail
          go test ./server/... -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
      - name: comment coverage success
        if: steps.go-test.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":bar_chart: Go test coverage (go tool cover): **${{ steps.go-test.outputs.total }}**"
      - name: comment coverage failure
        if: steps.go-test.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Go tests failed. Coverage report unavailable."

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: meshery-cloud/ui/package-lock.json
      - name: comment success
        if: steps.setup-node.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Setup Node.js for Cloud UI validation. Installing dependencies..."
      - name: comment failure
        if: steps.setup-node.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to setup Node.js for Cloud UI validation."

      - name: Install Cloud UI dependencies
        id: install-cloud-ui-deps
        working-directory: meshery-cloud
        run: make ui-setup
      - name: comment success
        if: steps.install-cloud-ui-deps.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Installed Cloud UI dependencies. Running Cloud UI tests..."
      - name: comment failure
        if: steps.install-cloud-ui-deps.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to install Cloud UI dependencies."

      - name: Run Cloud UI tests
        id: cloud-ui-tests
        working-directory: meshery-cloud
        run: make cloud-ui-tests
      - name: comment success
        if: steps.cloud-ui-tests.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Cloud UI tests passed. Proceeding with staging build setup."
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Cloud UI tests failed. Aborting staging build."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: meshery-cloud/ui/package-lock.json
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Setup Node.js for Cloud UI validation. Installing dependencies..."
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to setup Node.js for Cloud UI validation."

      - name: Install Cloud UI dependencies
        working-directory: meshery-cloud
        run: make ui-setup
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Installed Cloud UI dependencies. Running Cloud UI tests..."
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to install Cloud UI dependencies."

      - name: Run Cloud UI tests
        working-directory: meshery-cloud
        run: make cloud-ui-tests
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Cloud UI tests passed. Proceeding with staging build setup."
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Cloud UI tests failed. Aborting staging build."

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('meshery-cloud/ui/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: meshery-cloud/ui
        run: npx playwright install --with-deps
      # ALLURE_RESULTS_DIR routes allure-playwright (when wired in
      # meshery-cloud) to a path the sync-to-qa step collects. Until that
      # reporter is added, the directory stays empty and sync no-ops.
      - name: Run Cloud UI e2e tests
        id: cloud-ui-e2e
        working-directory: meshery-cloud/ui
        continue-on-error: true
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/meshery-cloud/ui/allure-results
        run: npm run e2e
      - name: comment e2e success
        if: steps.cloud-ui-e2e.outcome == 'success'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Cloud UI e2e tests passed."
      - name: comment e2e failure
        if: steps.cloud-ui-e2e.outcome == 'failure'
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Cloud UI e2e tests failed."

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Setup QEMU"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to setup QEMU"


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Setup Docker Buildx"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to setup Docker Buildx"


      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: layer5/meshery-cloud
          flavor: |
            latest=true
          tags: |
            type=raw,value=staging-{{sha}}
            type=raw,value=staging-${{env.PR_NUMBER}}
            type=raw,value=staging-latest
            type=raw,value=staging-${{env.GIT_VERSION}}
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Configured Docker Meta"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to configure Docker Meta"


      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Logged into Docker Hub <br />           :heavy_check_mark: Building and pushing Cloud container image to Hub (takes approximately 7 min 30 sec)"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to log into Docker Hub"
      

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: https://github.com/layer5io/meshery-cloud.git#refs/pull/${{ inputs.pr_number }}/head
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          build-args: |
            ENVIRONMENT="staging"
            GIT_VERSION=staging-${{env.PR_NUMBER}}
            RELEASE_CHANNEL=staging
            TOKEN=${{ secrets.GLOBAL_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":heavy_check_mark: Built and pushed Cloud container image to Hub"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":x: Failed to build and push Cloud container image to Hub"
        

      - name: Deploy staging on OCI OKE
        id: deploy
        uses: appleboy/ssh-action@master
        env:
            PR_NUMBER: ${{env.PR_NUMBER}}
            GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        with:
          host: ${{ secrets.OCI_BASTION_HOST }}
          username: ${{ secrets.OCI_BASTION_USERNAME }}
          key: ${{ secrets.OCI_BASTION_KEY }}
          port: 22
          envs: PR_NUMBER
          # This script will exit immediately if any command fails.
          # Alternate sync operation: git pull https://l5io:$GH_ACCESS_TOKEN@github.com/layer5io/meshery-cloud.git master
          script: |
            bash
            set -e 
            helm repo update layer5
            cd deploy/meshery-cloud
            gh repo sync
            cd ../..
            kubectl config use-context staging 
            helm upgrade -f ~/deploy/meshery-cloud/install/environment/staging/values.yaml cloud ~/deploy/meshery-cloud/install/kubernetes/helm/layer5-cloud/ -n staging --set=image.tag=staging-$PR_NUMBER --set-file 'kratos.kratos.emailTemplates.recovery.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-recover-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.recovery.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-recover.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.subject'=./deploy/meshery-cloud/config/email-templates/valid/email-verify-subject.body.gotmpl --set-file 'kratos.kratos.emailTemplates.verification.valid.body'=./deploy/meshery-cloud/config/email-templates/valid/email-verify.body.gotmpl            
      - name: comment success
        if: success()
        uses: ./.github/actions/cloud-comment
        with:
          message: ":white_check_mark: Deployed staging on OCI OKE at https://staging-cloud.layer5.io"
      - name: comment failure
        if: failure()
        uses: ./.github/actions/cloud-comment
        with:
          message: |
            :x: Failed to deploy staging on OCI OKE
            See [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      # Publish Cloud test results to the QA repo. Go server tests
      # (allure-go) → meshery-server-results/. Cloud UI Jest + Playwright
      # e2e (via allure reporters in meshery-cloud) → remote-provider-results/,
      # the bucket aligned to the Layer5Cloud project in qa's allurerc.mjs.
      # PR runs are routed under pr-reports/<N>/ to keep them out of the
      # canonical master dashboard.
      - name: Checkout QA
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          repository: meshery-extensions/qa
          path: qa
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Sync Cloud test results to qa
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pr_number }}" ]; then
            BASE="qa/pr-reports/${{ inputs.pr_number }}"
          else
            BASE="qa"
          fi
          SERVER_DEST="$BASE/meshery-server-results"
          CLOUD_DEST="$BASE/remote-provider-results"
          rm -rf "$SERVER_DEST" "$CLOUD_DEST"
          mkdir -p "$SERVER_DEST" "$CLOUD_DEST"

          # allure-go writes into both $ALLURE_OUTPUT_PATH/allure-results
          # and per-package allure-results dirs depending on test setup.
          for dir in \
            meshery-cloud/allure-results \
            meshery-cloud/server/*/allure-results; do
            [ -d "$dir" ] || continue
            cp -R "$dir/." "$SERVER_DEST/" 2>/dev/null || true
          done

          for dir in meshery-cloud/ui/allure-results; do
            [ -d "$dir" ] || continue
            cp -R "$dir/." "$CLOUD_DEST/" 2>/dev/null || true
          done

          echo "meshery-server-results: $(find "$SERVER_DEST" -type f | wc -l) file(s)"
          echo "remote-provider-results: $(find "$CLOUD_DEST" -type f | wc -l) file(s)"

      - name: Commit & push Cloud results to qa
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Cloud] Sync test results - ${GITHUB_SHA}"
          commit_options: --signoff
          repository: qa
          file_pattern: ${{ inputs.pr_number != '' && format('pr-reports/{0}', inputs.pr_number) || 'meshery-server-results remote-provider-results' }}
          commit_user_name: meshery-ci
          commit_user_email: ci@meshery.io
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Comment QA dashboard link
        if: ${{ !cancelled() && inputs.pr_number != '' }}
        uses: ./.github/actions/cloud-comment
        with:
          message: ":bar_chart: [QA dashboard for this PR](https://qa.meshery.io/pr/${{ inputs.pr_number }}/)"

  set-final-status:
    runs-on: ubuntu-24.04
    if: always()
    needs: [build-meshery-cloud]
    steps:
      - name: Set final commit status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const buildResult = '${{ needs.build-meshery-cloud.result }}';
            const state = buildResult === 'success' ? 'success' : 'failure';
            const descriptions = {
              success: 'Cloud build and tests passed',
              failure: 'Cloud build and tests failed',
              cancelled: 'Cloud build was cancelled',
              skipped: 'Cloud build was skipped',
            };
            await github.rest.repos.createCommitStatus({
              owner: 'layer5io',
              repo: 'meshery-cloud',
              sha: '${{ inputs.pr_commit_sha }}',
              state,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: descriptions[buildResult] || descriptions.failure,
              context: 'Meshery Cloud Build'
            });

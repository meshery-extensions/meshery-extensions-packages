name: Meshery Cloud Build Reusable
on:
  workflow_call:
    inputs:
      pr_commit_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      node_version:
        description: "Node.js version for UI build/tests"
        required: false
        default: "22.x"
        type: string
    secrets:
      PROVIDER_TOKEN:
        required: true
      GLOBAL_TOKEN:
        required: true
      GH_ACCESS_TOKEN:
        required: true
      LAYER5_CLOUD_TESTING_BOT_EMAIL:
        required: true
      LAYER5_CLOUD_TESTING_BOT_PASSWORD:
        required: true
      DOCKER_USERNAME: 
        required: true
      DOCKER_PASSWORD: 
        required: true
      MAIL_USERNAME: 
        required: true
      MAIL_PASSWORD: 
        required: true
      OCI_BASTION_HOST:
        required: true
      OCI_BASTION_USERNAME:
        required: true
      OCI_BASTION_KEY:
        required: true
        
jobs:
  # set-pending-status:
